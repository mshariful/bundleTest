# The main pipeline for bundleTest

resources:
  pipelines:
    bundleTest_etl:
      name: bundleTest_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/bundleTest_etl"

      libraries:
        - glob:
            include: ../src/bundleTest_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
