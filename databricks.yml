# This is a Declarative Automation Bundle definition for bundleTest.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bundleTest
  uuid: 52e6fdaa-0e97-4308-9d89-0347afd200c5

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-8006445a-459f.cloud.databricks.com
    variables:
      catalog: assetbundles
      schema: learnbundles
  prod:
    mode: production
    workspace:
      host: https://dbc-8006445a-459f.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/endromida@hotmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/endromida@hotmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: assetbundles
      schema: prod
    permissions:
      - user_name: endromida@hotmail.com
        level: CAN_MANAGE
